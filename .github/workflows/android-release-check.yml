name: Android release check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published CuePatch Android tag
        required: true
        type: string

      check_cloud:
        description: Send one fictional rehearsal to Firebase through the installed APK
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  launch-signed-apk:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'android-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the released APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "CuePatch-${TAG#android-v}.apk"
          mv "CuePatch-${TAG#android-v}.apk" CuePatch.apk
          sha256sum CuePatch.apk
      - name: Start an Android 14 emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$SYSTEM_IMAGE" emulator platform-tools
          export ANDROID_AVD_HOME="$RUNNER_TEMP/cuepatch-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          avd_path="$ANDROID_AVD_HOME/cuepatch.avd"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name cuepatch --package "$SYSTEM_IMAGE" --path "$avd_path" <<< no
          test -s "$avd_path/config.ini"
          if [[ ! -s "$ANDROID_AVD_HOME/cuepatch.ini" ]]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$avd_path" > "$ANDROID_AVD_HOME/cuepatch.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx cuepatch
          nohup "$ANDROID_HOME/emulator/emulator" -avd cuepatch -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader < /dev/null > emulator.log 2>&1 &
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -qx 1; do sleep 3; done'
          adb shell input keyevent 82
      - name: Install and open the desk offline
        run: |
          set -euo pipefail
          adb install CuePatch.apk
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell am start -W -n app.riven.cuepatch/.DeskActivity
          for attempt in $(seq 1 15); do
            adb shell uiautomator dump /sdcard/cuepatch-window.xml >/dev/null || true
            adb exec-out cat /sdcard/cuepatch-window.xml > window.xml || true
            if grep -Eiq 'Opening night|Review a change|On standby|Open caller view|Production desk' window.xml; then
              adb shell pidof app.riven.cuepatch
              adb exec-out screencap -p > android-desk.png
              exit 0
            fi
            sleep 2
          done
          adb logcat -d -b crash
          exit 1
      - name: Call a block and restore it offline
        run: python3 .github/scripts/android-desk-check.py offline
      - name: Exercise native Firebase cloud fallback
        if: github.event_name == 'workflow_dispatch' && inputs.check_cloud
        run: python3 .github/scripts/android-desk-check.py cloud
      - name: Show emulator diagnostics on failure
        if: failure()
        run: tail -60 emulator.log || true
      - name: Retain the emulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-desk
          path: android-desk.png
          retention-days: 7
